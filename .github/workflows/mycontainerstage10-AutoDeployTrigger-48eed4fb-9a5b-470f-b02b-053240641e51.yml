name: Trigger auto deployment for mycontainerstage10

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ stage-10 ]
    paths:
    - '**'
    - '.github/workflows/mycontainerstage10-AutoDeployTrigger-48eed4fb-9a5b-470f-b02b-053240641e51.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.MYCONTAINERSTAGE10_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.MYCONTAINERSTAGE10_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.MYCONTAINERSTAGE10_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: myrgst.azurecr.io
          registryUsername: ${{ secrets.MYCONTAINERSTAGE10_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.MYCONTAINERSTAGE10_REGISTRY_PASSWORD }}
          containerAppName: mycontainerstage10
          resourceGroup: stage10-RG
          imageToBuild: myrgst.azurecr.io/mycontainerstage10:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


